<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>實尺寸照片／證件排版</title>
  <style>
    :root{--ink:#17231e;--muted:#66736d;--brand:#176b4b;--brand2:#dff1e8;--paper:#fff;--line:#d9dfdb;--bg:#edf0ed;--danger:#a33b31;--zoom:1;--handle-size:8mm;--paper-w:210mm;--paper-h:297mm}
    *{box-sizing:border-box}[hidden]{display:none!important} body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    button,input,select{font:inherit} button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:330px minmax(0,1fr) 300px;grid-template-rows:auto}
    .panel{grid-column:1;grid-row:1;background:#f9faf8;border-right:1px solid var(--line);padding:24px;overflow:auto;height:100vh;position:sticky;top:0}
    h1{font-size:22px;margin:0 0 5px;letter-spacing:.02em}.sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:22px}
    .section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.section h2{font-size:14px;margin:0 0 12px}
    label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0;flex:1}
    select,input[type=number]{width:100%;border:1px solid #cbd3ce;background:#fff;border-radius:9px;padding:9px;color:var(--ink)}
    .setup-card{border:2px solid #9bcab5;background:#f1f8f4;border-radius:14px;padding:14px;margin-top:14px}.setup-card label.step{font-size:13px;font-weight:800;color:var(--ink);margin-top:12px}.setup-card label.step:first-child{margin-top:0}.setup-card select{font-size:16px;font-weight:700;border:2px solid var(--brand);padding:12px;background:#fff}.setup-card .upload{margin-top:14px;padding:16px;font-size:16px}
    .upload{display:block;text-align:center;padding:13px;border:1px dashed var(--brand);background:var(--brand2);color:var(--brand);border-radius:11px;font-weight:700;cursor:pointer}.upload input{display:none}
    .btn{border:1px solid #cbd3ce;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}.btn.danger{color:var(--danger)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .wide{grid-column:1/-1}
    .hint{background:#eef4f0;border-radius:10px;padding:10px;font-size:12px;line-height:1.55;color:#4e5c55}.privacy{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--muted);margin-top:12px}.privacy b{color:var(--brand)}
    .workspace{grid-column:2;grid-row:1;padding:30px;overflow:auto;display:flex;flex-direction:column;align-items:center}.toolbar{width:min(100%,850px);display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:var(--muted);font-size:13px}.zoom{display:flex;align-items:center;gap:8px}.zoom input{width:130px}
    .stage{width:calc(var(--paper-w) * var(--zoom));height:calc(var(--paper-h) * var(--zoom));position:relative;margin-bottom:40px}
    .paper{position:absolute;left:0;top:0;width:var(--paper-w);height:var(--paper-h);background:var(--paper);box-shadow:0 14px 45px #1a262129;transform:scale(var(--zoom));transform-origin:top left;overflow:hidden}
    .safe{position:absolute;inset:5mm;border:.25mm dashed #bfc8c2;pointer-events:none}.safe::before{content:"建議安全邊界 5 mm";position:absolute;top:1mm;left:2mm;color:#adb6b0;font-size:2.7mm}
    .doc{position:absolute;touch-action:none;user-select:none;border:.35mm solid transparent;background:#f3f3f3;cursor:move}.doc.selected{border-color:#159463;box-shadow:0 0 0 .7mm #15946333}.doc .viewport{width:100%;height:100%;overflow:hidden;position:relative}.doc img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;transform-origin:center}.doc .tag{display:none;position:absolute;bottom:100%;left:-.35mm;background:#159463;color:#fff;font-size:2.7mm;padding:.7mm 1.3mm;white-space:nowrap}.doc.selected .tag{display:block}
    .resize-handle{display:none;position:absolute;width:var(--handle-size);height:var(--handle-size);background:#fff;border:.8mm solid #159463;border-radius:50%;z-index:5;touch-action:none;box-shadow:0 0 0 .8mm #15946333;transform:translate(-50%,-50%)}.doc.selected .resize-handle{display:block}.resize-handle.nw{left:0;top:0;cursor:nwse-resize}.resize-handle.ne{left:100%;top:0;cursor:nesw-resize}.resize-handle.sw{left:0;top:100%;cursor:nesw-resize}.resize-handle.se{left:100%;top:100%;cursor:nwse-resize}
    .watermark{display:none;position:absolute;left:50%;top:50%;max-width:90%;padding:1.5mm 3mm;border:.65mm solid currentColor;border-radius:2mm;transform:translate(-50%,-50%) rotate(-12deg);font-weight:900;line-height:1.15;text-align:center;white-space:normal;overflow-wrap:anywhere;pointer-events:none;z-index:2}.watermark.show{display:block}.watermark.gray{border-radius:0;border-width:.35mm}
    .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#9aa49e;font-size:4mm;line-height:1.7;pointer-events:none}.has-docs .empty{display:none}
    .calibration{display:none}.calibration .bar{width:50mm;border-top:.4mm solid #000;position:relative}.calibration .bar:before,.calibration .bar:after{content:"";position:absolute;top:-1.5mm;height:3mm;border-left:.4mm solid #000}.calibration .bar:before{left:0}.calibration .bar:after{right:0}.calibration span{font-size:3mm}
    .status{font-size:12px;color:var(--brand);min-height:18px;margin-top:8px}
    .crop-modal{position:fixed;inset:0;z-index:50;background:#101713d9;display:grid;place-items:center;padding:20px}.crop-modal[hidden]{display:none}.crop-card{width:min(900px,96vw);background:#f9faf8;border-radius:16px;padding:18px;box-shadow:0 22px 70px #0008}.crop-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.crop-head h2{font-size:17px;margin:0}.crop-wrap{height:min(62vh,620px);background:#202823;border-radius:10px;display:grid;place-items:center;overflow:hidden;position:relative}.crop-wrap canvas{max-width:100%;max-height:100%;touch-action:none;cursor:grab}.crop-wrap canvas:active{cursor:grabbing}.crop-tools{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.crop-tools input[type=range]{flex:1;min-width:150px}.crop-note{font-size:12px;color:var(--muted)}
    .view-controls{background:#eef4f0;border-radius:10px;padding:9px;margin:8px 0}.view-controls input[type=range]{width:100%;accent-color:var(--brand)}.control-label{display:flex;justify-content:space-between;gap:8px}.tool-block{border:1px solid #d6e0da;background:#f8fbf9;border-radius:9px;margin-top:7px;padding:0 8px 8px}.tool-block:first-child{margin-top:0}.tool-title{font-size:13px;font-weight:800;cursor:pointer;list-style:none;padding:8px 18px 8px 0;position:relative}.tool-title::-webkit-details-marker{display:none}.tool-title:after{content:"＋";position:absolute;right:0;color:var(--brand);font-size:16px;line-height:1}.tool-block[open]>.tool-title:after{content:"−"}.example-buttons{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.example-buttons button{border:1px solid #b8c8bf;background:#fff;border-radius:99px;padding:5px 8px;font-size:11px;color:#355047}.watermark-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}.watermark-row input[type=text]{width:100%;border:1px solid #cbd3ce;background:#fff;border-radius:8px;padding:7px;color:var(--ink)}
    .sheet-head,.sheet-tabs{display:none}.sheet-tab-panel{display:block}
    .output-panel{grid-column:3;grid-row:1;align-self:start;position:sticky;top:24px;background:#f9faf8;border:1px solid var(--line);border-radius:14px;padding:18px;margin:24px 18px 24px 0}.output-panel h2{font-size:16px;margin:0 0 12px}.output-panel .actions{grid-template-columns:1fr 1fr}.output-panel .actions .wide{grid-column:1/-1}
    @media(max-width:1100px){.app{grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto auto}.panel{grid-column:1;grid-row:1/3}.workspace{grid-column:2;grid-row:1}.output-panel{grid-column:2;grid-row:2;position:relative;top:auto;width:calc(100% - 36px);margin:0 18px 28px}}
    @media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto auto auto}.panel{grid-column:1;grid-row:1;height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line);padding:13px}.workspace{grid-column:1;grid-row:2;padding:10px;align-items:flex-start}.output-panel{grid-column:1;grid-row:3;width:calc(100% - 20px);margin:0 10px 18px;padding:12px}.output-panel .actions{grid-template-columns:1fr 1fr}.output-panel .actions .wide{grid-column:1/-1}.stage{margin-left:0}.doc{touch-action:pan-y}.btn{min-height:36px;padding:7px 8px;font-size:13px}.toolbar{position:sticky;left:0;margin-bottom:10px}.crop-modal{padding:6px}.crop-card{padding:9px}.crop-wrap{height:55vh}.crop-tools{gap:6px;margin-top:7px}.crop-tools .btn{flex:1 1 45%}body.mobile-editing .app{padding-bottom:39vh}#inspector.editing{position:fixed;z-index:45;left:0;right:0;bottom:0;margin:0;padding:0 10px 10px;background:#f9faf8;border-top:1px solid var(--line);border-radius:15px 15px 0 0;box-shadow:0 -10px 30px #17231e30;max-height:39vh;overflow:auto;overscroll-behavior:contain;animation:sheet-in .2s cubic-bezier(.2,.8,.2,1)}@keyframes sheet-in{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}#inspector.editing>h2{display:none}.sheet-head{display:flex;position:sticky;top:0;z-index:2;background:#f9faf8;align-items:center;justify-content:space-between;padding:4px 0 2px}.sheet-handle{border:0;background:transparent;flex:1;padding:4px;text-align:left;font-size:13px;font-weight:800;color:var(--ink)}.sheet-handle:before{content:"";display:block;width:36px;height:4px;background:#b8c2bc;border-radius:9px;margin:0 auto 3px}.sheet-close{border:0;background:#e8ece9;border-radius:50%;width:30px;height:30px;font-size:18px}.sheet-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;position:sticky;top:38px;z-index:2;background:#f9faf8;padding-bottom:5px}.sheet-tabs button{border:0;border-radius:7px;padding:7px 3px;background:#e8ece9;color:var(--muted);font-size:12px}.sheet-tabs button.active{background:var(--brand);color:#fff;font-weight:700}.sheet-tab-panel{display:none;padding:0 1px 4px}.sheet-tab-panel.active{display:block}.view-controls{padding:7px;margin:5px 0}.view-controls label{margin:5px 0 2px}.view-controls input[type=range]{height:18px}.tool-block{margin-top:6px;padding-top:6px}.tool-title{font-size:12px}.example-buttons{gap:4px}.example-buttons button{padding:4px 7px;font-size:10px}.watermark-row input[type=text],.watermark-row select{padding:6px;font-size:12px}#itemCustomSize{margin:2px 0 6px;align-items:flex-end}#itemCustomSize label{line-height:1.2;margin-top:4px}#inspector.editing .actions{margin-top:5px;padding-bottom:1px;gap:5px}#inspector.editing.collapsed{max-height:48px;overflow:hidden;animation:none}#inspector.editing.collapsed .sheet-tabs,#inspector.editing.collapsed #selectionControls{display:none}}
    @media(max-width:800px){#inspector.editing.collapsed #selectionControls{display:block}#inspector.editing.collapsed .sheet-head{display:flex}#inspector.editing.collapsed .sheet-tabs,#inspector.editing.collapsed .sheet-tab-panel,#inspector.editing.collapsed .actions{display:none}}
    @page{size:A4 portrait;margin:0}
    @media print{html,body{width:var(--paper-w);height:var(--paper-h);margin:0!important;padding:0!important;background:#fff}.panel,.toolbar{display:none!important}.app,.workspace,.stage{display:block!important;width:var(--paper-w)!important;height:var(--paper-h)!important;margin:0!important;padding:0!important;overflow:hidden!important}.paper{position:relative!important;box-shadow:none!important;transform:none!important}.safe,.tag,.empty,.resize-handle{display:none!important}.doc,.doc.selected{border:0!important;box-shadow:none!important}.calibration.show{display:block!important;position:absolute;left:10mm;bottom:7mm}}
  </style>
</head>
<body>
<main class="app">
  <aside class="panel">
    <h1>實尺寸照片／證件排版</h1>
    <div class="sub">先選紙張，再選每張照片要印出的實際尺寸。圖片保持原比例，不會被拉扁。</div>
    <div class="setup-card">
      <label class="step" for="paperSize">① 輸出紙張</label>
      <select id="paperSize">
        <option value="210,297">A4（210 × 297 mm）</option>
        <option value="297,420">A3（297 × 420 mm）</option>
        <option value="148,210">A5（148 × 210 mm）</option>
        <option value="101.6,152.4">4 × 6 相片紙（101.6 × 152.4 mm）</option>
        <option value="127,177.8">5 × 7 相片紙（127 × 177.8 mm）</option>
        <option value="152.4,203.2">6 × 8 相片紙（152.4 × 203.2 mm）</option>
        <option value="203.2,254">8 × 10 相片紙（203.2 × 254 mm）</option>
        <option value="215.9,279.4">Letter（215.9 × 279.4 mm）</option>
      </select>
      <label class="step" for="preset">② 照片／證件印出尺寸</label>
      <select id="preset">
        <optgroup label="證件與文件">
          <option value="85.6,54">身分證／健保卡／信用卡（85.6 × 54 mm）</option>
          <option value="125,88">護照封面（125 × 88 mm）</option>
          <option value="140,88">常見存摺封面（140 × 88 mm）</option>
          <option value="210,297">A4 文件（210 × 297 mm）</option>
        </optgroup>
        <optgroup label="大頭照">
          <option value="28,35">台灣一吋大頭照（28 × 35 mm）</option>
          <option value="35,45">台灣二吋／護照照（35 × 45 mm）</option>
          <option value="25,35">國際一吋照片（25 × 35 mm）</option>
          <option value="30,40">履歷照片（30 × 40 mm）</option>
          <option value="51,51">美國簽證照（51 × 51 mm）</option>
        </optgroup>
        <optgroup label="一般照片">
          <option value="89,127">3.5 × 5 相片（89 × 127 mm）</option>
          <option value="101.6,152.4">4 × 6 相片（101.6 × 152.4 mm）</option>
          <option value="127,177.8">5 × 7 相片（127 × 177.8 mm）</option>
          <option value="152.4,203.2">6 × 8 相片（152.4 × 203.2 mm）</option>
        </optgroup>
        <option value="custom">自訂印出長寬</option>
      </select>
      <div class="row" id="customPreset" hidden><div><label>自訂寬度 mm</label><input id="customW" type="number" min="5" max="215.9" step="0.1" value="100"></div><div><label>自訂高度 mm</label><input id="customH" type="number" min="5" max="297" step="0.1" value="100"></div></div>
      <label class="upload">③ 選擇或拍攝照片<input id="file" type="file" accept="image/*,.heic,.heif,image/heic,image/heif" multiple></label>
    </div>
    <div class="privacy"><b>✓</b><span>圖片只在你的瀏覽器本機處理，不會上傳。</span></div>

    <section class="section" id="inspector">
      <h2>選取文件設定</h2>
      <div id="noSelection" class="hint">點選 A4 上的文件，即可調整尺寸與位置。</div>
      <div id="selectionControls" hidden>
        <div class="sheet-head"><button class="sheet-handle" id="sheetHandle">編輯所選照片</button><button class="sheet-close" id="sheetClose" aria-label="關閉">×</button></div>
        <div class="sheet-tabs"><button class="active" data-sheet-tab="size">尺寸</button><button data-sheet-tab="view">裁切／畫面</button><button data-sheet-tab="adjust">修圖／印章</button></div>
        <div class="sheet-tab-panel active" data-sheet-panel="size">
          <label>這張照片的印出類型</label><select id="itemPreset"></select>
          <div class="row" id="itemCustomSize" hidden><div><label>自訂寬度 mm</label><input id="w" type="number" min="5" max="210" step="0.1"></div><div><label>自訂高度 mm</label><input id="h" type="number" min="5" max="297" step="0.1"></div></div>
          <button class="btn" id="rotate">交換寬度與高度</button>
        </div>
        <div class="sheet-tab-panel" data-sheet-panel="view">
          <div class="view-controls">
            <div class="actions"><button class="btn primary" id="editCrop">四角裁切／拉正</button><button class="btn" id="fit">移入可列印區</button></div>
            <label>框內顯示方式</label><select id="displayMode"><option value="cover">填滿列印框（可移動畫面）</option><option value="contain">完整顯示照片（可能留白）</option></select>
            <label>圖片縮放 <span id="imageZoomLabel">100%</span></label><input id="imageZoom" type="range" min="100" max="300" value="100">
            <div class="row"><div><label>左右位置</label><input id="imageX" type="range" min="0" max="100" value="50"></div><div><label>上下位置</label><input id="imageY" type="range" min="0" max="100" value="50"></div></div>
          </div>
        </div>
        <div class="sheet-tab-panel" data-sheet-panel="adjust">
          <div class="view-controls">
            <details class="tool-block">
              <summary class="tool-title">照片清晰調整</summary>
              <button class="btn primary" id="autoEnhance" type="button">自動調整證件清晰度</button>
              <label class="control-label"><span>曝光</span><b id="exposureLabel">0</b></label><input id="exposure" type="range" min="-50" max="50" value="0">
              <label class="control-label"><span>對比</span><b id="contrastLabel">0</b></label><input id="contrast" type="range" min="-50" max="50" value="0">
              <label class="control-label"><span>清晰度</span><b id="sharpnessLabel">0</b></label><input id="sharpness" type="range" min="0" max="100" value="0">
              <label class="control-label"><span>色彩</span><b id="saturationLabel">0</b></label><input id="saturation" type="range" min="-50" max="50" value="0">
              <button class="btn" id="resetAdjustments" type="button">恢復原始效果</button>
            </details>
            <details class="tool-block">
              <summary class="tool-title">浮水印印章</summary>
              <label><input id="watermarkEnabled" type="checkbox"> 顯示浮水印</label>
              <div class="watermark-row"><div><label for="watermarkText">文字可自行輸入</label><input id="watermarkText" type="text" maxlength="30" placeholder="例如：僅供申請使用"></div><div><label for="watermarkStyle">樣式</label><select id="watermarkStyle" aria-label="浮水印樣式"><option value="stamp">紅色印章</option><option value="gray">灰色浮水印</option></select></div></div>
              <label>文字方向</label><select id="watermarkDirection"><option value="horizontal">橫式</option><option value="vertical">直式</option></select>
              <label class="control-label"><span>透明度</span><b id="watermarkOpacityLabel">55%</b></label><input id="watermarkOpacity" type="range" min="15" max="100" value="55">
              <label class="control-label"><span>文字大小</span><b id="watermarkSizeLabel">18</b></label><input id="watermarkSize" type="range" min="10" max="36" value="18">
              <div class="row"><div><label class="control-label"><span>左右位置</span><b id="watermarkXLabel">50%</b></label><input id="watermarkX" type="range" min="0" max="100" value="50"></div><div><label class="control-label"><span>上下位置</span><b id="watermarkYLabel">50%</b></label><input id="watermarkY" type="range" min="0" max="100" value="50"></div></div>
              <label>範例（點一下即可套用）</label>
              <div class="example-buttons"><button type="button" data-watermark="僅供申請使用">僅供申請使用</button><button type="button" data-watermark="僅供身分驗證">僅供身分驗證</button><button type="button" data-watermark="與正本相符">與正本相符</button><button type="button" data-watermark="COPY">COPY</button></div>
            </details>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="duplicate">複製這張</button><button class="btn danger" id="remove">刪除這張</button>
        </div>
      </div>
    </section>

  </aside>

  <section class="workspace" id="dropzone">
    <div class="toolbar"><span id="paperLabel">A4 · 210 × 297 mm</span><div class="zoom"><span>預覽</span><input id="zoom" type="range" min="20" max="100" value="72"><b id="zoomLabel">72%</b></div></div>
    <div class="stage"><div class="paper" id="paper">
      <div class="safe"></div><div class="empty">將圖片拖到這裡<br>或從左側選擇圖片</div>
      <div class="calibration" id="calibration"><div class="bar"></div><span>此線應為 50 mm</span></div>
    </div></div>
  </section>
  <section class="output-panel">
    <h2>最後一步：排列與輸出</h2>
    <div class="actions">
      <button class="btn" id="auto">自動排列</button><button class="btn" id="clear">全部清除</button>
      <button class="btn primary wide" id="print">下載 PDF</button>
    </div>
    <label><input id="showCal" type="checkbox"> PDF 加入 50 mm 校正尺</label>
    <div class="status" id="status"></div>
    <div class="hint">輸出的 PDF 會使用上方選擇的紙張實際尺寸，照片位置、縮放與顯示範圍會按照目前版面寫入，不會開啟列印視窗。</div>
  </section>
</main>
<div class="crop-modal" id="cropModal" hidden>
  <div class="crop-card">
    <div class="crop-head"><h2>四角透視校正</h2><button class="btn" id="cancelCrop">取消</button></div>
    <div class="crop-wrap" id="cropWrap"><canvas id="cropCanvas" width="800" height="520"></canvas></div>
    <div class="crop-tools">
      <button class="btn" id="autoCorners">自動找四角（快速）</button>

$('#rotate').onclick=()=>{if(!selected)return;[selected.w,selected.h]=[selected.h,selected.w];selected.ratio=selected.w/selected.h;render(selected);selectDoc(selected)};

function imageReady(src){return new Promise((resolve,reject)=>{const img=new Image;img.onload=()=>resolve(img);img.onerror=reject;img.src=src})}
function sharpenCanvas(canvas,amount){if(!amount||canvas.width*canvas.height>4000000)return;const g=canvas.getContext('2d'),im=g.getImageData(0,0,canvas.width,canvas.height),src=new Uint8ClampedArray(im.data),dst=im.data,w=canvas.width,h=canvas.height,a=amount/100*.75;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4;for(let c=0;c<3;c++){const center=src[i+c],around=(src[i-4+c]+src[i+4+c]+src[i-w*4+c]+src[i+w*4+c])/4;dst[i+c]=clamp(center+(center-around)*a,0,255)}}g.putImageData(im,0,0)}

function openCrop(){if(!selected)return;crop.doc=selected;crop.points=[];crop.img=new Image;crop.img.onload=()=>{$('#cropModal').hidden=false;drawCrop()};crop.img.src=selected.originalSrc||selected.el.querySelector('img').src}
$('#editCrop').onclick=openCrop;$('#cancelCrop').onclick=()=>$('#cropModal').hidden=true;$('#cropReset').onclick=()=>resetCorners();
$('#cropRotate').onclick=()=>{const t=document.createElement('canvas');t.width=crop.img.height;t.height=crop.img.width;const g=t.getContext('2d');g.translate(t.width,0);g.rotate(Math.PI/2);g.drawImage(crop.img,0,0);const n=new Image;n.onload=()=>{crop.img=n;crop.points=[];drawCrop()};n.src=t.toDataURL('image/jpeg',.95)};
function pointerPos(e){const r=cc.getBoundingClientRect();return{x:(e.clientX-r.left)*cc.width/r.width,y:(e.clientY-r.top)*cc.height/r.height}}
cc.addEventListener('pointerdown',e=>{const p=pointerPos(e);let nearest=0,dist=Infinity;crop.points.forEach((q,i)=>{const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<dist){dist=d;nearest=i}});crop.active=dist<=35?nearest:-1;if(crop.active>=0)cc.setPointerCapture(e.pointerId)});cc.addEventListener('pointermove',e=>{if(crop.active<0)return;const p=pointerPos(e),v=crop.view;crop.points[crop.active]={x:clamp(p.x,v.x,v.x+v.w),y:clamp(p.y,v.y,v.y+v.h)};drawCrop()});cc.addEventListener('pointerup',()=>crop.active=-1);
function orderPoints(a){const s=[...a];const tl=s.reduce((u,p)=>p.x+p.y<u.x+u.y?p:u,s[0]),br=s.reduce((u,p)=>p.x+p.y>u.x+u.y?p:u,s[0]),tr=s.reduce((u,p)=>p.x-p.y>u.x-u.y?p:u,s[0]),bl=s.reduce((u,p)=>p.x-p.y<u.x-u.y?p:u,s[0]);return[tl,tr,br,bl]}
function solve(A,b){for(let i=0;i<b.length;i++){let m=i;for(let j=i+1;j<b.length;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];const d=A[i][i];if(Math.abs(d)<1e-10)throw Error('無法計算透視');for(let k=i;k<A[i].length;k++)A[i][k]/=d;b[i]/=d;for(let j=0;j<b.length;j++)if(j!==i){const f=A[j][i];for(let k=i;k<A[j].length;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i]}}return b}
function homography(dst,src){const A=[],b=[];for(let i=0;i<4;i++){const x=dst[i].x,y=dst[i].y,u=src[i].x,v=src[i].y;A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}return solve(A,b)}
function perspectiveImage(){const v=crop.view,src=orderPoints(crop.points).map(p=>({x:(p.x-v.x)/v.sc,y:(p.y-v.y)/v.sc})),top=Math.hypot(src[1].x-src[0].x,src[1].y-src[0].y),bottom=Math.hypot(src[2].x-src[3].x,src[2].y-src[3].y),left=Math.hypot(src[3].x-src[0].x,src[3].y-src[0].y),right=Math.hypot(src[2].x-src[1].x,src[2].y-src[1].y),ratio=crop.doc.w/crop.doc.h;let ow=1400,oh=Math.round(ow/ratio);if(ratio<1){oh=1400;ow=Math.round(oh*ratio)}const source=document.createElement('canvas');source.width=crop.img.width;source.height=crop.img.height;source.getContext('2d').drawImage(crop.img,0,0);const sd=source.getContext('2d').getImageData(0,0,source.width,source.height),out=document.createElement('canvas');out.width=ow;out.height=oh;const od=out.getContext('2d').createImageData(ow,oh),H=homography([{x:0,y:0},{x:ow-1,y:0},{x:ow-1,y:oh-1},{x:0,y:oh-1}],src);for(let y=0;y<oh;y++)for(let x=0;x<ow;x++){const z=H[6]*x+H[7]*y+1,sx=(H[0]*x+H[1]*y+H[2])/z,sy=(H[3]*x+H[4]*y+H[5])/z,ix=clamp(Math.round(sx),0,source.width-1),iy=clamp(Math.round(sy),0,source.height-1),si=(iy*source.width+ix)*4,di=(y*ow+x)*4;od.data[di]=sd.data[si];od.data[di+1]=sd.data[si+1];od.data[di+2]=sd.data[si+2];od.data[di+3]=255}out.getContext('2d').putImageData(od,0,0);return out.toDataURL('image/jpeg',.95)}
$('#applyCrop').onclick=()=>{try{setStatus('正在拉正證件…');const src=perspectiveImage();crop.doc.el.querySelector('img').src=src;crop.doc.originalSrc=src;$('#cropModal').hidden=true;setStatus('已完成四角透視校正')}catch(e){setStatus(e.message||'透視校正失敗')}};
function detectCornersLightweight(){const maxW=360,maxH=260,ratio=crop.img.width/crop.img.height;let w=maxW,h=Math.round(w/ratio);if(h>maxH){h=maxH;w=Math.round(h*ratio)}w=Math.max(80,w);h=Math.max(80,h);const scan=document.createElement('canvas');scan.width=w;scan.height=h;const g=scan.getContext('2d',{willReadFrequently:true});g.drawImage(crop.img,0,0,w,h);const px=g.getImageData(0,0,w,h).data,gray=new Uint8Array(w*h);for(let i=0,j=0;i<px.length;i+=4,j++)gray[j]=Math.round(px[i]*.2126+px[i+1]*.7152+px[i+2]*.0722);const ranges=[[2,Math.floor(w*.55),2,Math.floor(h*.55),-1,-1],[Math.floor(w*.45),w-2,2,Math.floor(h*.55),1,-1],[Math.floor(w*.45),w-2,Math.floor(h*.45),h-2,1,1],[2,Math.floor(w*.55),Math.floor(h*.45),h-2,-1,1]],found=[];for(const [x0,x1,y0,y1,sx,sy] of ranges){let best=null,bestScore=0;for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){const i=y*w+x,gx=-gray[i-w-1]-2*gray[i-1]-gray[i+w-1]+gray[i-w+1]+2*gray[i+1]+gray[i+w+1],gy=-gray[i-w-1]-2*gray[i-w]-gray[i-w+1]+gray[i+w-1]+2*gray[i+w]+gray[i+w+1],edge=Math.hypot(gx,gy);if(edge<50)continue;const outward=((sx<0?(w/2-x)/(w/2):(x-w/2)/(w/2))+(sy<0?(h/2-y)/(h/2):(y-h/2)/(h/2)))/2,score=edge+Math.max(0,outward)*800;if(score>bestScore){bestScore=score;best={x,y}}}if(!best)throw Error('沒有找到清楚的四個角，請手動拖曳綠色圓點');found.push(best)}const area=Math.abs(found.reduce((sum,p,i)=>{const q=found[(i+1)%4];return sum+p.x*q.y-q.x*p.y},0)/2);if(area<w*h*.08)throw Error('證件邊緣不夠清楚，請手動拖曳綠色圓點');const v=crop.view;return found.map(p=>({x:v.x+p.x/w*v.w,y:v.y+p.y/h*v.h}))}
$('#autoCorners').onclick=async()=>{const btn=$('#autoCorners'),old=btn.textContent;btn.disabled=true;btn.textContent='偵測中…';try{await new Promise(resolve=>requestAnimationFrame(()=>resolve()));crop.points=detectCornersLightweight();drawCrop();setStatus('已找到可能的證件四角，請確認綠點位置')}catch(e){setStatus(e.message||'自動偵測失敗，請手動調整四角')}finally{btn.disabled=false;btn.textContent=old}};
